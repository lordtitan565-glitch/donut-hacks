
name: Build Donut Hacks

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Find project and build JAR
        id: build
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find . -name build.gradle -not -path '*/.gradle/*' -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ] && [ ! -f build.gradle ]; then
            echo "ERROR: Could not find build.gradle"
            exit 1
          fi

          cd "$PROJECT_DIR"
          gradle build --no-daemon

          echo "jar_dir=$PROJECT_DIR/build/libs" >> "$GITHUB_OUTPUT"

      - name: Upload finished JAR
        uses: actions/upload-artifact@v4
        with:
          name: donut-hacks-jar
          path: |
            ${{ steps.build.outputs.jar_dir }}/*.jar
            !${{ steps.build.outputs.jar_dir }}/*-dev.jar
            !${{ steps.build.outputs.jar_dir }}/*-sources.jar
